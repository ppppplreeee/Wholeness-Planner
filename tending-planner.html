<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tending — Daily Wholeness Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F0E8;
    --bg2: #EDE7D9;
    --bg3: #E2D9C8;
    --ink: #2A2420;
    --ink2: #5C4F44;
    --ink3: #9A8878;
    --accent: #7B5E3A;
    --accent2: #B08860;
    --gold: #C9A96E;
    --low: #A04030;
    --low-bg: #F5EAE8;
    --emotional: #8B5E6A;
    --intellectual: #4A6B7A;
    --spiritual: #6B5E8B;
    --practical: #5A7A5A;
    --physical: #7A6B4A;
    --relational: #7A4A5A;
    --border: rgba(90,70,50,0.15);
    --shadow: 0 2px 12px rgba(42,36,32,0.08);
    --radius: 10px;
    --font-serif: 'Cormorant Garamond', Georgia, serif;
    --font-mono: 'DM Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-serif);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    font-size: 16px;
    line-height: 1.6;
  }

  /* HEADER */
  header {
    background: var(--ink);
    color: var(--bg);
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  header h1 {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    font-style: italic;
  }

  header .date {
    font-family: var(--font-mono);
    font-size: 0.7rem;
    color: var(--ink3);
    letter-spacing: 0.08em;
  }

  .header-actions { display: flex; gap: 10px; align-items: center; }

  /* NAV TABS */
  nav {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    display: flex;
    padding: 0 24px;
    gap: 0;
  }

  nav button {
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    padding: 12px 16px;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    cursor: pointer;
    transition: all 0.2s;
  }

  nav button.active {
    color: var(--accent);
    border-bottom-color: var(--accent);
  }

  nav button:hover { color: var(--ink2); }

  /* MAIN LAYOUT */
  main { max-width: 1100px; margin: 0 auto; padding: 24px 20px 60px; }

  /* LOW ALERTS */
  .alerts-bar {
    background: var(--low-bg);
    border: 1px solid rgba(160,64,48,0.2);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 24px;
    display: none;
  }

  .alerts-bar.visible { display: block; }

  .alerts-bar h3 {
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--low);
    margin-bottom: 10px;
  }

  .alerts-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .alert-chip {
    background: white;
    border: 1px solid rgba(160,64,48,0.25);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.75rem;
    color: var(--low);
    font-family: var(--font-mono);
    font-size: 0.65rem;
    letter-spacing: 0.05em;
  }

  .alert-chip span { color: var(--ink3); margin-right: 4px; }

  /* DOMAINS GRID */
  .domains-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
  }

  .domain-card {
    background: white;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .domain-header {
    padding: 14px 18px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
  }

  .domain-label {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .domain-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .domain-name {
    font-size: 1.05rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    color: var(--ink);
  }

  .domain-sub {
    font-size: 0.7rem;
    font-family: var(--font-mono);
    color: var(--ink3);
    letter-spacing: 0.06em;
    margin-top: 2px;
  }

  .domain-stats {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--ink3);
    text-align: right;
  }

  /* TODAY SLOT */
  .today-slot {
    padding: 14px 18px;
    min-height: 90px;
    border-bottom: 1px solid var(--border);
  }

  .today-slot-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 8px;
  }

  .task-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    position: relative;
    cursor: pointer;
    transition: box-shadow 0.15s;
  }

  .task-card:hover { box-shadow: 0 2px 8px rgba(42,36,32,0.1); }

  .task-card.completed {
    opacity: 0.5;
    text-decoration: line-through;
  }

  .task-title {
    font-size: 0.9rem;
    color: var(--ink);
    margin-bottom: 6px;
    line-height: 1.4;
  }

  .task-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }

  .tag {
    font-family: var(--font-mono);
    font-size: 0.58rem;
    letter-spacing: 0.04em;
    padding: 2px 7px;
    border-radius: 10px;
    background: var(--bg2);
    color: var(--ink2);
    border: 1px solid var(--border);
  }

  .tag.mode-receptive { background: #EBE8F5; color: #5A4A8B; border-color: rgba(90,74,139,0.2); }
  .tag.mode-expressive { background: #E8F0EB; color: #3A6A4A; border-color: rgba(58,106,74,0.2); }
  .tag.temporal-past { background: #F0EBE8; color: #7A4A3A; border-color: rgba(122,74,58,0.2); }
  .tag.temporal-present { background: #E8EDF0; color: #3A5A7A; border-color: rgba(58,90,122,0.2); }
  .tag.temporal-future { background: #EBF0E8; color: #4A7A3A; border-color: rgba(74,122,58,0.2); }
  .tag.polarity-maintenance { background: #F0EEE8; color: #7A6A3A; border-color: rgba(122,106,58,0.2); }
  .tag.polarity-aliveness { background: #F0E8EE; color: #7A3A6A; border-color: rgba(122,58,106,0.2); }

  .task-actions {
    position: absolute;
    top: 8px;
    right: 8px;
    display: flex;
    gap: 4px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .task-card:hover .task-actions { opacity: 1; }

  .task-btn {
    width: 22px;
    height: 22px;
    border: 1px solid var(--border);
    background: white;
    border-radius: 4px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65rem;
    color: var(--ink3);
    transition: all 0.15s;
  }

  .task-btn:hover { background: var(--bg2); color: var(--ink); }
  .task-btn.complete-btn:hover { background: #E8F0E8; color: #3A6A3A; border-color: #3A6A3A; }
  .task-btn.delete-btn:hover { background: #F5E8E8; color: #A04030; border-color: #A04030; }
  .task-btn.edit-btn:hover { background: #E8EEF5; color: #3A5A7A; border-color: #3A5A7A; }

  .empty-slot {
    border: 1.5px dashed var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
    color: var(--ink3);
    font-size: 0.8rem;
    font-style: italic;
    cursor: pointer;
    transition: all 0.15s;
  }

  .empty-slot:hover { border-color: var(--accent2); color: var(--accent); background: var(--bg2); }

  /* BUCKET */
  .bucket-section { padding: 12px 18px 16px; }

  .bucket-label {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
  }

  .bucket-label .toggle { font-size: 0.7rem; }

  .bucket-list { display: flex; flex-direction: column; gap: 6px; }

  .bucket-item {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .bucket-item:hover { background: var(--bg3); box-shadow: 0 1px 4px rgba(42,36,32,0.08); }

  .bucket-item-title { font-size: 0.82rem; color: var(--ink2); flex: 1; }

  .bucket-promote {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--accent2);
    opacity: 0;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  .bucket-item:hover .bucket-promote { opacity: 1; }

  .add-task-btn {
    width: 100%;
    background: none;
    border: 1px dashed var(--border);
    border-radius: 6px;
    padding: 7px;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    color: var(--ink3);
    cursor: pointer;
    transition: all 0.15s;
    text-align: center;
    margin-top: 6px;
  }

  .add-task-btn:hover { border-color: var(--accent2); color: var(--accent); background: var(--bg); }

  /* INSIGHTS VIEW */
  .insights-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 20px;
  }

  .insight-card {
    background: white;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .insight-card h3 {
    font-size: 0.85rem;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: var(--ink2);
    margin-bottom: 14px;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }

  .bar-label {
    font-size: 0.78rem;
    color: var(--ink2);
    width: 120px;
    flex-shrink: 0;
    font-style: italic;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .bar-track {
    flex: 1;
    height: 6px;
    background: var(--bg2);
    border-radius: 3px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--gold);
    border-radius: 3px;
    transition: width 0.4s ease;
  }

  .bar-count {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--ink3);
    width: 20px;
    text-align: right;
  }

  /* MODAL */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(42,36,32,0.5);
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }

  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: white;
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 8px 40px rgba(42,36,32,0.2);
    transform: translateY(10px);
    transition: transform 0.2s;
  }

  .modal-overlay.open .modal { transform: translateY(0); }

  .modal h2 {
    font-size: 1.3rem;
    font-weight: 300;
    font-style: italic;
    margin-bottom: 20px;
    color: var(--ink);
  }

  .field {
    margin-bottom: 16px;
  }

  .field label {
    display: block;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink3);
    margin-bottom: 6px;
  }

  .field input[type="text"], .field textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 9px 12px;
    font-family: var(--font-serif);
    font-size: 0.92rem;
    color: var(--ink);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s;
  }

  .field input:focus, .field textarea:focus {
    border-color: var(--accent2);
  }

  .field textarea { min-height: 60px; resize: vertical; }

  .toggle-group {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .toggle-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 0.8rem;
    font-family: var(--font-serif);
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.15s;
  }

  .toggle-btn.selected {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .needs-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 5px;
    max-height: 200px;
    overflow-y: auto;
    padding: 2px;
  }

  .need-btn {
    border: 1px solid var(--border);
    background: var(--bg);
    border-radius: 5px;
    padding: 5px 8px;
    font-size: 0.72rem;
    font-family: var(--font-serif);
    color: var(--ink2);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    line-height: 1.3;
  }

  .need-btn.selected {
    background: var(--bg2);
    border-color: var(--accent2);
    color: var(--accent);
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 22px;
  }

  .btn {
    padding: 9px 20px;
    border-radius: 7px;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid transparent;
  }

  .btn-primary {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  .btn-primary:hover { background: var(--ink); border-color: var(--ink); }

  .btn-secondary {
    background: white;
    color: var(--ink2);
    border-color: var(--border);
  }

  .btn-secondary:hover { background: var(--bg2); }

  /* HEADER BUTTONS */
  .icon-btn {
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: var(--bg);
    border-radius: 6px;
    padding: 6px 12px;
    font-family: var(--font-mono);
    font-size: 0.62rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    transition: all 0.15s;
  }

  .icon-btn:hover { background: rgba(255,255,255,0.2); }

  /* BACKUP MODAL */
  .backup-area {
    width: 100%;
    height: 120px;
    font-family: var(--font-mono);
    font-size: 0.65rem;
    padding: 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink2);
    resize: none;
  }

  /* DOMAIN COLOURS */
  .dot-emotional { background: var(--emotional); }
  .dot-intellectual { background: var(--intellectual); }
  .dot-spiritual { background: var(--spiritual); }
  .dot-practical { background: var(--practical); }
  .dot-physical { background: var(--physical); }
  .dot-relational { background: var(--relational); }

  /* SECTION HEADINGS */
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .section-header h2 {
    font-size: 1.1rem;
    font-weight: 300;
    font-style: italic;
    color: var(--ink2);
    letter-spacing: 0.04em;
  }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    main { padding: 16px 14px 60px; }
    .domains-grid { grid-template-columns: 1fr; }
    .needs-grid { grid-template-columns: 1fr; }
  }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 2px; }

  .bucket-collapsed { display: none; }

  .completed-count {
    font-family: var(--font-mono);
    font-size: 0.6rem;
    color: var(--ink3);
    margin-left: 8px;
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Tending</h1>
    <div class="date" id="headerDate"></div>
  </div>
  <div class="header-actions">
    <button class="icon-btn" onclick="openBackup()">Backup</button>
    <button class="icon-btn" onclick="openRestore()">Restore</button>
  </div>
</header>

<nav>
  <button class="active" onclick="showTab('today', this)">Today</button>
  <button onclick="showTab('insights', this)">Insights</button>
</nav>

<main>

  <!-- ALERTS -->
  <div class="alerts-bar" id="alertsBar">
    <h3>Undernourished — consider tending to</h3>
    <div class="alerts-grid" id="alertsGrid"></div>
  </div>

  <!-- TODAY TAB -->
  <div id="tab-today">
    <div class="domains-grid" id="domainsGrid"></div>
  </div>

  <!-- INSIGHTS TAB -->
  <div id="tab-insights" style="display:none">
    <div class="section-header">
      <h2>Patterns over time</h2>
    </div>
    <div class="insights-grid" id="insightsGrid"></div>
  </div>

</main>

<!-- TASK MODAL -->
<div class="modal-overlay" id="taskModal">
  <div class="modal">
    <h2 id="modalTitle">New task</h2>
    <div class="field">
      <label>Task</label>
      <input type="text" id="taskTitleInput" placeholder="What will you tend to?">
    </div>
    <div class="field">
      <label>Domain</label>
      <div class="toggle-group" id="domainToggle"></div>
    </div>
    <div class="field">
      <label>Mode</label>
      <div class="toggle-group">
        <button class="toggle-btn" data-group="mode" data-value="Receptive" onclick="selectToggle(this)">Receptive</button>
        <button class="toggle-btn" data-group="mode" data-value="Expressive" onclick="selectToggle(this)">Expressive</button>
      </div>
    </div>
    <div class="field">
      <label>Temporal</label>
      <div class="toggle-group">
        <button class="toggle-btn" data-group="temporal" data-value="Past" onclick="selectToggle(this)">Past</button>
        <button class="toggle-btn" data-group="temporal" data-value="Present" onclick="selectToggle(this)">Present</button>
        <button class="toggle-btn" data-group="temporal" data-value="Future" onclick="selectToggle(this)">Future</button>
      </div>
    </div>
    <div class="field">
      <label>Polarity</label>
      <div class="toggle-group">
        <button class="toggle-btn" data-group="polarity" data-value="Maintenance" onclick="selectToggle(this)">Maintenance</button>
        <button class="toggle-btn" data-group="polarity" data-value="Aliveness" onclick="selectToggle(this)">Aliveness</button>
      </div>
    </div>
    <div class="field">
      <label>Needs (select all that apply)</label>
      <div class="needs-grid" id="needsGrid"></div>
    </div>
    <div class="field">
      <label>Place in</label>
      <div class="toggle-group">
        <button class="toggle-btn selected" data-group="placement" data-value="bucket" onclick="selectToggle(this)">Bucket</button>
        <button class="toggle-btn" data-group="placement" data-value="today" onclick="selectToggle(this)">Today</button>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('taskModal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveTask()">Save</button>
    </div>
  </div>
</div>

<!-- BACKUP MODAL -->
<div class="modal-overlay" id="backupModal">
  <div class="modal">
    <h2>Backup data</h2>
    <p style="font-size:0.85rem;color:var(--ink2);margin-bottom:16px;">Copy this JSON and keep it somewhere safe.</p>
    <textarea class="backup-area" id="backupText" readonly></textarea>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('backupModal')">Close</button>
      <button class="btn btn-primary" onclick="copyBackup()">Copy to clipboard</button>
    </div>
  </div>
</div>

<!-- RESTORE MODAL -->
<div class="modal-overlay" id="restoreModal">
  <div class="modal">
    <h2>Restore from backup</h2>
    <p style="font-size:0.85rem;color:var(--ink2);margin-bottom:16px;">Paste your backup JSON below. This will replace all current data.</p>
    <textarea class="backup-area" id="restoreText" placeholder="Paste JSON here..."></textarea>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal('restoreModal')">Cancel</button>
      <button class="btn btn-primary" onclick="restoreData()">Restore</button>
    </div>
  </div>
</div>

<script>
// ─── DATA ───────────────────────────────────────────────────────────────────

const DOMAINS = [
  { id: 'emotional',    label: 'Emotional',    sub: 'Feeling life', color: '#8B5E6A' },
  { id: 'intellectual', label: 'Intellectual', sub: 'Understanding & learning', color: '#4A6B7A' },
  { id: 'spiritual',    label: 'Spiritual',    sub: 'Meaning, depth, mystery', color: '#6B5E8B' },
  { id: 'practical',    label: 'Practical',    sub: 'Reality & stewardship', color: '#5A7A5A' },
  { id: 'physical',     label: 'Physical',     sub: 'Body, energy, environment', color: '#7A6B4A' },
  { id: 'relational',   label: 'Relational',   sub: 'Others, intimacy, community', color: '#7A4A5A' },
];

const NEEDS = [
  // Survival & Embodiment
  "Safety",
  "Security",
  "Stability & Consistency",
  "Satiety",
  "Body & Sensory Aliveness",
  "Rest & Recovery",
  "Comfort, Home-Making & Ease",
  // Nourishment & Pleasure
  "Joy, Pleasure, Delight",
  "Emotional Nourishment",
  "Intellectual Nourishment",
  "Play",
  "Solitude",
  // Expression & Connection
  "Expression",
  "Connection",
  "Being Known",
  "Belonging",
  "Care, Tending & Nurturing towards Self and Relationships",
  // Growth & Agency
  "Freedom, Autonomy & Self-Realisation",
  "Growth",
  "Resources, Knowledge & Skills Building",
  "Planning",
  "Management, Strategy & Fructification",
  // Meaning & Transcendence
  "Meaning-Making",
  "Impact & Contribution",
  "Transcendence",
];

// ─── STATE ──────────────────────────────────────────────────────────────────

function defaultState() {
  return {
    tasks: [],       // { id, title, domain, mode, temporal, polarity, needs[], placement:'bucket'|'today'|'done', createdAt }
    votes: {
      domains: {},   // domain -> count
      modes: {},     // 'domain:mode' -> count
      temporals: {}, // 'domain:temporal' -> count
      polarities: {},// 'domain:polarity' -> count
      needs: {},     // need -> count
    }
  };
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem('tending_state');
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem('tending_state', JSON.stringify(state));
}

// ─── MODAL STATE ────────────────────────────────────────────────────────────

let editingTaskId = null;
let fixedDomain = null;

// ─── INIT ───────────────────────────────────────────────────────────────────

document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('headerDate').textContent = new Date().toLocaleDateString('en-GB', {
    weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
  });
  buildDomainToggles();
  buildNeedsGrid();
  render();
});

// ─── RENDER ──────────────────────────────────────────────────────────────────

function render() {
  renderDomains();
  renderAlerts();
}

function renderDomains() {
  const grid = document.getElementById('domainsGrid');
  grid.innerHTML = '';

  DOMAINS.forEach(domain => {
    const todayTask = state.tasks.find(t => t.domain === domain.id && t.placement === 'today');
    const bucket = state.tasks.filter(t => t.domain === domain.id && t.placement === 'bucket');

    const card = document.createElement('div');
    card.className = 'domain-card';

    const completedToday = state.tasks.filter(t => t.domain === domain.id && t.placement === 'done' && isToday(t.completedAt)).length;

    card.innerHTML = `
      <div class="domain-header">
        <div class="domain-label">
          <div class="domain-dot dot-${domain.id}"></div>
          <div>
            <div class="domain-name">${domain.label}</div>
            <div class="domain-sub">${domain.sub}</div>
          </div>
        </div>
        <div class="domain-stats">${completedToday > 0 ? completedToday + ' done today' : ''}</div>
      </div>
      <div class="today-slot">
        <div class="today-slot-label">Today</div>
        ${todayTask ? renderTaskCard(todayTask) : `<div class="empty-slot" onclick="openNewTask('${domain.id}', 'today')">+ Assign a task for today</div>`}
      </div>
      <div class="bucket-section">
        <div class="bucket-label" onclick="toggleBucket('bucket-${domain.id}', this)">
          <span>Bucket <span style="color:var(--accent2)">(${bucket.length})</span></span>
          <span class="toggle">▾</span>
        </div>
        <div id="bucket-${domain.id}" class="bucket-list">
          ${bucket.map(t => renderBucketItem(t)).join('')}
          <button class="add-task-btn" onclick="openNewTask('${domain.id}', 'bucket')">+ Add to bucket</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function renderTaskCard(task) {
  const needsSample = task.needs.slice(0, 3);
  return `
    <div class="task-card ${task.placement === 'done' ? 'completed' : ''}" id="task-${task.id}">
      <div class="task-actions">
        <button class="task-btn complete-btn" title="Complete" onclick="completeTask('${task.id}')">✓</button>
        <button class="task-btn edit-btn" title="Edit" onclick="editTask('${task.id}')">✎</button>
        <button class="task-btn delete-btn" title="Remove" onclick="removeTask('${task.id}')">×</button>
      </div>
      <div class="task-title">${task.title}</div>
      <div class="task-tags">
        ${task.mode ? `<span class="tag mode-${task.mode.toLowerCase()}">${task.mode}</span>` : ''}
        ${task.temporal ? `<span class="tag temporal-${task.temporal.toLowerCase()}">${task.temporal}</span>` : ''}
        ${task.polarity ? `<span class="tag polarity-${task.polarity.toLowerCase()}">${task.polarity}</span>` : ''}
        ${needsSample.map(n => `<span class="tag">${n}</span>`).join('')}
        ${task.needs.length > 3 ? `<span class="tag">+${task.needs.length - 3}</span>` : ''}
      </div>
    </div>
  `;
}

function renderBucketItem(task) {
  return `
    <div class="bucket-item" onclick="promoteToToday('${task.id}')">
      <div class="bucket-item-title">${task.title}</div>
      <span class="bucket-promote">→ Today</span>
      <button class="task-btn edit-btn" title="Edit" onclick="event.stopPropagation(); editTask('${task.id}')" style="opacity:1;margin-left:4px">✎</button>
      <button class="task-btn delete-btn" title="Delete" onclick="event.stopPropagation(); deleteTask('${task.id}')" style="opacity:1">×</button>
    </div>
  `;
}

function renderAlerts() {
  const alerts = computeAlerts();
  const bar = document.getElementById('alertsBar');
  const grid = document.getElementById('alertsGrid');
  grid.innerHTML = '';

  if (alerts.length === 0) {
    bar.classList.remove('visible');
    return;
  }

  bar.classList.add('visible');
  alerts.forEach(a => {
    const chip = document.createElement('div');
    chip.className = 'alert-chip';
    chip.innerHTML = `<span>Low:</span>${a}`;
    grid.appendChild(chip);
  });
}

function renderInsights() {
  const grid = document.getElementById('insightsGrid');
  grid.innerHTML = '';

  const v = state.votes;

  // Domains
  appendInsightCard(grid, 'By Domain', DOMAINS.map(d => ({
    label: d.label,
    count: v.domains[d.id] || 0,
    color: d.color
  })));

  // Modes across all domains
  const modeData = ['Receptive', 'Expressive'].map(m => ({
    label: m,
    count: DOMAINS.reduce((sum, d) => sum + (v.modes[`${d.id}:${m}`] || 0), 0)
  }));
  appendInsightCard(grid, 'Mode', modeData);

  // Temporal
  const temporalData = ['Past', 'Present', 'Future'].map(t => ({
    label: t,
    count: DOMAINS.reduce((sum, d) => sum + (v.temporals[`${d.id}:${t}`] || 0), 0)
  }));
  appendInsightCard(grid, 'Temporal', temporalData);

  // Polarity
  const polarityData = ['Maintenance', 'Aliveness'].map(p => ({
    label: p,
    count: DOMAINS.reduce((sum, d) => sum + (v.polarities[`${d.id}:${p}`] || 0), 0)
  }));
  appendInsightCard(grid, 'Maintenance vs Aliveness', polarityData);

  // Needs (top + bottom)
  const needsData = NEEDS.map(n => ({ label: n, count: v.needs[n] || 0 }))
    .sort((a, b) => b.count - a.count);
  appendInsightCard(grid, 'Needs (all)', needsData);
}

function appendInsightCard(grid, title, data) {
  const max = Math.max(...data.map(d => d.count), 1);
  const card = document.createElement('div');
  card.className = 'insight-card';
  card.innerHTML = `<h3>${title}</h3>` + data.map(d => `
    <div class="bar-row">
      <div class="bar-label" title="${d.label}">${d.label}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(d.count / max) * 100}%;${d.color ? `background:${d.color}` : ''}"></div>
      </div>
      <div class="bar-count">${d.count}</div>
    </div>
  `).join('');
  grid.appendChild(card);
}

// ─── ALERTS ──────────────────────────────────────────────────────────────────

function computeAlerts() {
  const alerts = [];
  const v = state.votes;

  DOMAINS.forEach(d => {
    // Lowest mode
    const modeScores = ['Receptive', 'Expressive'].map(m => ({ label: m, count: v.modes[`${d.id}:${m}`] || 0 }));
    const lowestMode = modeScores.sort((a, b) => a.count - b.count)[0];
    if (lowestMode.count === 0 || lowestMode.count < modeScores[1].count * 0.5) {
      alerts.push(`${d.label}: ${lowestMode.label}`);
    }

    // Lowest temporal
    const tScores = ['Past', 'Present', 'Future'].map(t => ({ label: t, count: v.temporals[`${d.id}:${t}`] || 0 }));
    const lowestT = tScores.sort((a, b) => a.count - b.count)[0];
    if (lowestT.count === 0 || lowestT.count < (tScores[2].count * 0.4)) {
      alerts.push(`${d.label}: ${lowestT.label}`);
    }

    // Lowest polarity
    const pScores = ['Maintenance', 'Aliveness'].map(p => ({ label: p, count: v.polarities[`${d.id}:${p}`] || 0 }));
    const lowestP = pScores.sort((a, b) => a.count - b.count)[0];
    if (lowestP.count === 0 || lowestP.count < pScores[1].count * 0.5) {
      alerts.push(`${d.label}: ${lowestP.label}`);
    }
  });

  // Bottom 2 needs globally
  const needsScores = NEEDS.map(n => ({ label: n, count: v.needs[n] || 0 }))
    .sort((a, b) => a.count - b.count);
  const bottom2 = needsScores.slice(0, 2);
  bottom2.forEach(n => alerts.push(`Need: ${n.label}`));

  return [...new Set(alerts)];
}

// ─── TASK ACTIONS ────────────────────────────────────────────────────────────

function completeTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  task.placement = 'done';
  task.completedAt = new Date().toISOString();

  // Cast votes
  const v = state.votes;
  v.domains[task.domain] = (v.domains[task.domain] || 0) + 1;
  if (task.mode) v.modes[`${task.domain}:${task.mode}`] = (v.modes[`${task.domain}:${task.mode}`] || 0) + 1;
  if (task.temporal) v.temporals[`${task.domain}:${task.temporal}`] = (v.temporals[`${task.domain}:${task.temporal}`] || 0) + 1;
  if (task.polarity) v.polarities[`${task.domain}:${task.polarity}`] = (v.polarities[`${task.domain}:${task.polarity}`] || 0) + 1;
  (task.needs || []).forEach(n => { v.needs[n] = (v.needs[n] || 0) + 1; });

  saveState();
  render();
}

function removeTask(id) {
  // Move back to bucket
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  task.placement = 'bucket';
  saveState();
  render();
}

function deleteTask(id) {
  state.tasks = state.tasks.filter(t => t.id !== id);
  saveState();
  render();
}

function promoteToToday(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  // Check if there's already a today task for this domain
  const existing = state.tasks.find(t => t.domain === task.domain && t.placement === 'today');
  if (existing) {
    existing.placement = 'bucket';
  }
  task.placement = 'today';
  saveState();
  render();
}

function toggleBucket(id, labelEl) {
  const list = document.getElementById(id);
  list.classList.toggle('bucket-collapsed');
  const toggle = labelEl.querySelector('.toggle');
  toggle.textContent = list.classList.contains('bucket-collapsed') ? '▸' : '▾';
}

// ─── MODAL: TASK ─────────────────────────────────────────────────────────────

function openNewTask(domain, placement) {
  editingTaskId = null;
  fixedDomain = domain || null;
  document.getElementById('modalTitle').textContent = 'New task';
  document.getElementById('taskTitleInput').value = '';
  clearToggles();
  if (domain) selectToggleByValue('domain', domain);
  selectToggleByValue('placement', placement || 'bucket');
  openModal('taskModal');
}

function editTask(id) {
  const task = state.tasks.find(t => t.id === id);
  if (!task) return;
  editingTaskId = id;
  document.getElementById('modalTitle').textContent = 'Edit task';
  document.getElementById('taskTitleInput').value = task.title;
  clearToggles();
  selectToggleByValue('domain', task.domain);
  if (task.mode) selectToggleByValue('mode', task.mode);
  if (task.temporal) selectToggleByValue('temporal', task.temporal);
  if (task.polarity) selectToggleByValue('polarity', task.polarity);
  selectToggleByValue('placement', task.placement === 'done' ? 'today' : task.placement);
  // Select needs
  document.querySelectorAll('.need-btn').forEach(btn => {
    btn.classList.toggle('selected', (task.needs || []).includes(btn.dataset.value));
  });
  openModal('taskModal');
}

function saveTask() {
  const title = document.getElementById('taskTitleInput').value.trim();
  if (!title) return;

  const domain = getToggleValue('domain');
  const mode = getToggleValue('mode');
  const temporal = getToggleValue('temporal');
  const polarity = getToggleValue('polarity');
  const placement = getToggleValue('placement') || 'bucket';
  const needs = Array.from(document.querySelectorAll('.need-btn.selected')).map(b => b.dataset.value);

  if (!domain) { alert('Please select a domain.'); return; }

  if (editingTaskId) {
    const task = state.tasks.find(t => t.id === editingTaskId);
    if (task) {
      // If moving to today, handle existing
      if (placement === 'today' && task.placement !== 'today') {
        const existing = state.tasks.find(t => t.domain === domain && t.placement === 'today' && t.id !== editingTaskId);
        if (existing) existing.placement = 'bucket';
      }
      Object.assign(task, { title, domain, mode, temporal, polarity, needs, placement });
    }
  } else {
    // If placing in today, handle existing
    if (placement === 'today') {
      const existing = state.tasks.find(t => t.domain === domain && t.placement === 'today');
      if (existing) existing.placement = 'bucket';
    }
    state.tasks.push({
      id: Date.now().toString(),
      title, domain, mode, temporal, polarity, needs, placement,
      createdAt: new Date().toISOString()
    });
  }

  saveState();
  closeModal('taskModal');
  render();
}

// ─── TOGGLE HELPERS ──────────────────────────────────────────────────────────

function selectToggle(btn) {
  const group = btn.dataset.group;
  document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}

function selectToggleByValue(group, value) {
  const btn = document.querySelector(`[data-group="${group}"][data-value="${value}"]`);
  if (btn) {
    document.querySelectorAll(`[data-group="${group}"]`).forEach(b => b.classList.remove('selected'));
    btn.classList.add('selected');
  }
}

function getToggleValue(group) {
  const btn = document.querySelector(`[data-group="${group}"].selected`);
  return btn ? btn.dataset.value : null;
}

function clearToggles() {
  document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('selected'));
  document.querySelectorAll('.need-btn').forEach(b => b.classList.remove('selected'));
  selectToggleByValue('placement', 'bucket');
}

function buildDomainToggles() {
  const container = document.getElementById('domainToggle');
  DOMAINS.forEach(d => {
    const btn = document.createElement('button');
    btn.className = 'toggle-btn';
    btn.dataset.group = 'domain';
    btn.dataset.value = d.id;
    btn.textContent = d.label;
    btn.onclick = () => selectToggle(btn);
    container.appendChild(btn);
  });
}

function buildNeedsGrid() {
  const grid = document.getElementById('needsGrid');
  NEEDS.forEach(n => {
    const btn = document.createElement('button');
    btn.className = 'need-btn';
    btn.dataset.value = n;
    btn.textContent = n;
    btn.onclick = () => btn.classList.toggle('selected');
    grid.appendChild(btn);
  });
}

// ─── TAB NAV ─────────────────────────────────────────────────────────────────

function showTab(name, btn) {
  document.getElementById('tab-today').style.display = name === 'today' ? '' : 'none';
  document.getElementById('tab-insights').style.display = name === 'insights' ? '' : 'none';
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  if (name === 'insights') renderInsights();
}

// ─── MODAL UTILS ─────────────────────────────────────────────────────────────

function openModal(id) {
  document.getElementById(id).classList.add('open');
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

// Close on overlay click
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) overlay.classList.remove('open');
  });
});

// ─── BACKUP / RESTORE ────────────────────────────────────────────────────────

function openBackup() {
  document.getElementById('backupText').value = JSON.stringify(state, null, 2);
  openModal('backupModal');
}

function copyBackup() {
  const text = document.getElementById('backupText');
  text.select();
  navigator.clipboard.writeText(text.value).then(() => {
    const btn = document.querySelector('#backupModal .btn-primary');
    btn.textContent = 'Copied ✓';
    setTimeout(() => btn.textContent = 'Copy to clipboard', 2000);
  });
}

function openRestore() {
  document.getElementById('restoreText').value = '';
  openModal('restoreModal');
}

function restoreData() {
  const raw = document.getElementById('restoreText').value.trim();
  try {
    const parsed = JSON.parse(raw);
    if (!parsed.tasks || !parsed.votes) throw new Error('Invalid format');
    state = parsed;
    saveState();
    closeModal('restoreModal');
    render();
  } catch(e) {
    alert('Invalid backup data. Please check the JSON and try again.');
  }
}

// ─── UTILS ───────────────────────────────────────────────────────────────────

function isToday(dateStr) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  const now = new Date();
  return d.toDateString() === now.toDateString();
}
